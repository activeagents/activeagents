# Generation provider configuration for ActiveAgent.
#
# Providers are only usable when their credentials are present in the
# environment. AgentExecutionService raises ProviderNotConfiguredError when a
# requested provider has none (see app/services/agent_execution_service.rb) —
# it does NOT fall back to :mock, so no stored run, trace or generation can
# hold a fabricated response.
#
# The mock provider ships with the activeagent gem and exercises the full
# prompt -> provider -> response pipeline (including usage accounting and
# instrumentation) without making network calls. It is accepted in the test
# environment only; it is listed below for the test block's sake.

shared:
  mock: &mock
    service: "Mock"

  openai: &openai
    service: "OpenAI"
    access_token: <%= ENV["OPENAI_API_KEY"] %>
    model: "gpt-4o-mini"

  anthropic: &anthropic
    service: "Anthropic"
    access_token: <%= ENV["ANTHROPIC_API_KEY"] %>
    model: "claude-sonnet-5"

  ollama: &ollama
    service: "Ollama"
    host: <%= ENV["OLLAMA_HOST"] %>
    model: "llama3"

  openrouter: &openrouter
    service: "OpenRouter"
    access_token: <%= ENV["OPENROUTER_API_KEY"] %>

development:
  # No mock here: execution refuses the mock provider outside the test
  # environment, so listing it would advertise a provider that cannot run.
  openai: *openai
  anthropic: *anthropic
  ollama: *ollama
  openrouter: *openrouter

test:
  mock: *mock

production:
  openai: *openai
  anthropic: *anthropic
  ollama: *ollama
  openrouter: *openrouter

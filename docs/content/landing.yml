features:
  heading: Open Source Gems
  subheading: "Everything you need to build AI-powered Rails applications \u2014 free and open source"
  items:
    - title: Active Agent
      description: Controllers for AI. Define actions, use callbacks, render views. Rails conventions for LLM interactions.
    - title: Action Prompt
      description: Composable prompt templates for your agents. Build, chain, and reuse prompts with Rails conventions.
    - title: Generation Providers
      description: "RubyLLM, OpenAI (official & community), Anthropic (official & community). Switch providers with one line of code."
    - title: Modules
      description: Extend your agents with pluggable modules for generation, instrumentation, error handling, and retries.
    - title: Instrumentation
      description: Built-in observability hooks for tracing, logging, and monitoring your agent interactions.
    - title: Error Handling
      description: Automatic retries with exponential backoff. Graceful degradation for production.
    - title: Retries
      description: Configurable retry strategies with backoff policies. Keep your agents resilient under load.
    - title: Streaming
      description: Real-time response streaming with callbacks for dynamic UIs and live updates.
    - title: Structured Output
      description: Extract typed data with JSON schemas. Validated responses for forms and APIs.

benefits:
  heading: Why Go Pro?
  subheading: The open source gems get you started. Pro gives you the tools to ship AI features with confidence.
  items:
    - icon: fa-solid fa-eye
      title: See What Your Agents Are Doing
      description: "Traces, cost analytics, and latency dashboards out of the box. Stop guessing why an agent gave a bad response — replay the full execution and find the issue in seconds."
    - icon: fa-solid fa-vial
      title: Evaluate Before You Ship
      description: "LLM-as-judge evaluators and A/B prompt testing catch regressions before your users do. Know that your prompt change actually improved quality, not just passed vibes-based review."
    - icon: fa-solid fa-arrows-split-up-and-left
      title: Build Multi-Step Workflows
      description: "Pausable agentic workflows with human-in-the-loop approval, webhooks, and timeouts. Break complex tasks into composable agent actions that can wait for real-world events."
    - icon: fa-solid fa-wand-magic-sparkles
      title: Generate UI From Your Agents
      description: "Generative UI and self-healing generators turn agent output into real Rails views. Ship dynamic interfaces that adapt to your data without writing templates by hand."
    - icon: fa-solid fa-shield-halved
      title: Stay Compliant Without the Overhead
      description: "Observable Compliance tracks every generation for audit trails. SOC 2, HIPAA, and regulatory requirements handled at the framework level, not bolted on after the fact."
    - icon: fa-solid fa-users
      title: Collaborate Across Your Team
      description: "Shared workspaces, team seats, and a hosted dashboard at app.activeagent.pro. Everyone sees the same traces, evals, and analytics — no more 'works on my machine' for AI features."


version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  # The "Agent gems" workflow moves these two exact pins together when the
  # gem repository releases, and lists the migrations to mirror.
  ignore:
  - dependency-name: activeagent
  - dependency-name: actionagent
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, lander-preview]
    paths:
      - 'app/views/pages/**'
      - 'app/views/layouts/landing/**'
      - 'app/views/layouts/landing_static.html.erb'
      - 'app/assets/stylesheets/landing/**'
      - 'app/javascript/controllers/**'
      - 'app/helpers/**'
      - 'app/controllers/pages_controller.rb'
      - 'public/fonts/**'
      - 'public/images/**'
      - 'public/vendor/**'
      - 'lib/tasks/static.rake'
      - '.github/workflows/gh-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Generate static landing page
        run: bundle exec rake static:generate

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

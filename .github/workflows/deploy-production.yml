name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (default: latest staging)'
        required: false
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  PROJECT_ID: active-agents-platform
  REGION: us-central1
  REPOSITORY: activeagents
  SERVICE_NAME: activeagents-production

jobs:
  # Require staging deployment success before production
  verify-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify staging is healthy
        run: |
          STAGING_URL=$(gcloud run services describe activeagents-staging --region=${{ env.REGION }} --format="value(status.url)")
          echo "Checking staging at: $STAGING_URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/up" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Staging environment is not healthy (status: $STATUS)"
            echo "Please ensure staging is working before deploying to production"
            exit 1
          fi
          echo "✅ Staging is healthy"

  determine-image:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Determine image tag
        id: image
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # For releases, use the release tag
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.image_tag }}" ]; then
            # For manual dispatch with specified tag
            TAG="${{ inputs.image_tag }}"
          else
            # Default to staging image
            TAG="staging"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using image tag: $TAG"

  build-production:
    needs: [verify-staging, determine-image]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/activeagents:${{ github.event.release.tag_name }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/activeagents:production
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/activeagents:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [verify-staging, determine-image, build-production]
    if: always() && needs.verify-staging.result == 'success' && needs.determine-image.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    # The smoke test reads these; without them needs.deploy.outputs.url is
    # empty and the health check curls "/up" with no host.
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      lb_ip: ${{ steps.deploy.outputs.lb_ip }}
      domain: ${{ steps.deploy.outputs.domain }}

    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.0

      - name: Determine image to deploy
        id: image
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/activeagents:${{ github.event.release.tag_name }}"
          else
            IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/activeagents:${{ needs.determine-image.outputs.image_tag }}"
          fi
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Terraform Init
        working-directory: terraform/environments/production
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform/environments/production
        run: |
          terraform plan \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="image=${{ steps.image.outputs.image }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/environments/production
        run: terraform apply -auto-approve tfplan

      - name: Get service URLs
        id: deploy
        working-directory: terraform/environments/production
        run: |
          # The Cloud Run URL is always reachable, so the smoke test uses it.
          # The domain only reaches this environment once staging's
          # dns.tfvars names the load balancer's IP (the cutover).
          URL=$(terraform output -raw cloud_run_url)
          LB_IP=$(terraform output -raw lb_ip_address 2>/dev/null || echo "")
          DOMAIN=$(terraform output -raw production_domain 2>/dev/null || echo "")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "lb_ip=$LB_IP" >> $GITHUB_OUTPUT
          echo "domain=$DOMAIN" >> $GITHUB_OUTPUT
          echo "### 🚀 Deployed to Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cloud Run URL:** $URL" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ steps.image.outputs.image }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "$LB_IP" ] && [ "$LB_IP" != "null" ]; then
            echo "**Load balancer IP:** $LB_IP" >> $GITHUB_STEP_SUMMARY
            echo "**Domain:** https://$DOMAIN (serves this environment once it resolves to the IP above)" >> $GITHUB_STEP_SUMMARY
          fi

  migrate:
    needs: deploy
    # build-production only runs for releases. On a manual dispatch it is
    # skipped, and a skipped job upstream skips every dependent job unless
    # that job says otherwise, so without this condition migrations never
    # ran on a dispatched deploy. Run them whenever the deploy itself passed.
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Run database migrations
        run: |
          gcloud run jobs execute activeagents-production-migrate \
            --region=${{ env.REGION }} \
            --wait \
          || {
            echo "--- migrate job logs (last hour) ---"
            gcloud logging read \
              'resource.type="cloud_run_job" AND resource.labels.job_name="activeagents-production-migrate"' \
              --project=${{ env.PROJECT_ID }} \
              --freshness=1h \
              --limit=200 \
              --order=asc \
              --format="value(textPayload)" || true
            exit 1
          }

  smoke-test:
    needs: [deploy, migrate]
    if: always() && needs.deploy.result == 'success' && needs.migrate.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Health check
        run: |
          URL="${{ needs.deploy.outputs.url }}"
          echo "Testing health endpoint at $URL/up"

          if [ -z "$URL" ]; then
            echo "❌ URL is empty, cannot perform health check"
            exit 1
          fi

          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/up" || echo "000")
            # 200 = healthy, 302 = IAP redirect (service is up), 403 = auth required but service is up
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ] || [ "$STATUS" = "403" ]; then
              echo "✅ Health check passed! (Status: $STATUS)"
              exit 0
            fi
            echo "Attempt $i: Status $STATUS, retrying in 10s..."
            sleep 10
          done

          echo "❌ Health check failed after 10 attempts"
          exit 1

      # Before the cutover the domain resolves to staging's load balancer and
      # this step only reports that. After it, the domain must answer from
      # the load balancer this deploy just applied, with a valid certificate.
      - name: Public hostname
        run: |
          DOMAIN="${{ needs.deploy.outputs.domain }}"
          LB_IP="${{ needs.deploy.outputs.lb_ip }}"
          if [ -z "$DOMAIN" ] || [ -z "$LB_IP" ] || [ "$LB_IP" = "null" ]; then
            echo "No load balancer in this environment; nothing to check"
            exit 0
          fi

          RESOLVED=$(dig +short "$DOMAIN" A @8.8.8.8 | tail -n 1)
          echo "$DOMAIN resolves to ${RESOLVED:-nothing}; the production load balancer is $LB_IP"

          if [ "$RESOLVED" != "$LB_IP" ]; then
            echo "The domain does not point at this environment yet (cutover pending: docs/infrastructure/production-environment.md)"
            # The load balancer itself must still answer for the domain, so
            # the cutover can be made without a deploy in between.
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --resolve "$DOMAIN:443:$LB_IP" "https://$DOMAIN/up" || echo "000")
            echo "https://$DOMAIN/up via $LB_IP: $STATUS"
            [ "$STATUS" = "200" ] || { echo "❌ The production load balancer does not serve $DOMAIN"; exit 1; }
            exit 0
          fi

          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$DOMAIN/up" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ https://$DOMAIN/up answered 200 from this environment"
              exit 0
            fi
            echo "Attempt $i: Status $STATUS, retrying in 10s..."
            sleep 10
          done

          echo "❌ https://$DOMAIN/up did not answer 200 after 10 attempts"
          exit 1

  notify:
    needs: [deploy, smoke-test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Notify on success
        if: needs.smoke-test.result == 'success'
        run: |
          echo "🎉 Production deployment successful!"
          # Add Slack/Discord notification here if needed

      - name: Notify on failure
        if: needs.smoke-test.result == 'failure'
        run: |
          echo "❌ Production deployment failed!"
          # Add alert notification here if needed
          exit 1

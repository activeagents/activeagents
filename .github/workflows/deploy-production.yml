name: Deploy to Production

on:
  # release.yml calls this for the newest release, once its image is public.
  # A release that workflow creates with GITHUB_TOKEN raises no `release`
  # event, so a call is what deploys it, and each release deploys once.
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to build and deploy, e.g. v1.8.1
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (default: latest staging)'
        required: false
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  PROJECT_ID: active-agents-platform
  REGION: us-central1
  REPOSITORY: activeagents
  SERVICE_NAME: activeagents-production

jobs:
  # Require staging deployment success before production
  verify-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify staging is healthy
        run: |
          STAGING_URL=$(gcloud run services describe activeagents-staging --region=${{ env.REGION }} --format="value(status.url)")
          echo "Checking staging at: $STAGING_URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/up" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Staging environment is not healthy (status: $STATUS)"
            echo "Please ensure staging is working before deploying to production"
            exit 1
          fi
          echo "✅ Staging is healthy"

  determine-image:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
      build: ${{ steps.image.outputs.build }}
    steps:
      - name: Determine image tag
        id: image
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            # A release builds its own image, tagged with the release
            TAG="$RELEASE_TAG"
            BUILD=true
          elif [ -n "$IMAGE_TAG" ]; then
            # For manual dispatch with specified tag
            TAG="$IMAGE_TAG"
            BUILD=false
          else
            # Default to staging image
            TAG="staging"
            BUILD=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $TAG"

  build-production:
    needs: [verify-staging, determine-image]
    if: needs.determine-image.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.determine-image.outputs.image_tag }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/activeagents:${{ needs.determine-image.outputs.image_tag }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/activeagents:production
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/activeagents:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [verify-staging, determine-image, build-production]
    # build-production is skipped when deploying an existing image, which is
    # why this runs on always(); a build that failed or was cancelled leaves
    # no image to deploy.
    if: >-
      always() &&
      needs.verify-staging.result == 'success' &&
      needs.determine-image.result == 'success' &&
      (needs.build-production.result == 'success' || needs.build-production.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    # The smoke test reads the URL from here.
    outputs:
      url: ${{ steps.deploy.outputs.url }}

    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.0

      - name: Determine image to deploy
        id: image
        env:
          IMAGE_TAG: ${{ needs.determine-image.outputs.image_tag }}
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/activeagents:$IMAGE_TAG"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Terraform Init
        working-directory: terraform/environments/production
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform/environments/production
        run: |
          terraform plan \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="image=${{ steps.image.outputs.image }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/environments/production
        run: terraform apply -auto-approve tfplan

      - name: Get Cloud Run URL
        id: deploy
        working-directory: terraform/environments/production
        run: |
          URL=$(terraform output -raw cloud_run_url)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "### 🚀 Deployed to Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $URL" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ steps.image.outputs.image }}" >> $GITHUB_STEP_SUMMARY

  migrate:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Run database migrations
        run: |
          gcloud run jobs execute activeagents-production-migrate \
            --region=${{ env.REGION }} \
            --wait

  smoke-test:
    needs: [deploy, migrate]
    runs-on: ubuntu-latest

    steps:
      - name: Health check
        run: |
          URL="${{ needs.deploy.outputs.url }}"
          echo "Testing health endpoint at $URL/up"

          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/up" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed!"
              exit 0
            fi
            echo "Attempt $i: Status $STATUS, retrying in 10s..."
            sleep 10
          done

          echo "❌ Health check failed after 10 attempts"
          exit 1

  notify:
    needs: [deploy, smoke-test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Notify on success
        if: needs.smoke-test.result == 'success'
        run: |
          echo "🎉 Production deployment successful!"
          # Add Slack/Discord notification here if needed

      - name: Notify on failure
        if: needs.smoke-test.result == 'failure'
        run: |
          echo "❌ Production deployment failed!"
          # Add alert notification here if needed
          exit 1

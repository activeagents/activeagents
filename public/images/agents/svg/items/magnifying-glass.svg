<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#E8F4FC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#B8D4E8" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Magnifying Glass -->
  <g id="magnifying-glass">
    <!-- Handle -->
    <rect x="42" y="42" width="8" height="20" rx="3" fill="#4A4A4A" transform="rotate(45 46 52)"/>

    <!-- Glass rim -->
    <circle cx="25" cy="25" r="22" fill="none" stroke="#5A5A5A" stroke-width="5"/>

    <!-- Glass -->
    <circle cx="25" cy="25" r="18" fill="url(#glassGradient)"/>

    <!-- Glass shine -->
    <path
      d="M 15 15 Q 12 20 15 25"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.8"
    />
  </g>
</svg>

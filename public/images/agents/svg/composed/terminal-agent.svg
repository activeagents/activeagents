<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <defs>
    <!-- Gem body gradient -->
    <linearGradient id="gemGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F28B8B"/>
      <stop offset="50%" stop-color="#E86B6B"/>
      <stop offset="100%" stop-color="#D45A5A"/>
    </linearGradient>

    <!-- Hat gradient -->
    <linearGradient id="hatGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5A5A5A"/>
      <stop offset="100%" stop-color="#3A3A3A"/>
    </linearGradient>

    <!-- Hand gradient -->
    <linearGradient id="handGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F28B8B"/>
      <stop offset="100%" stop-color="#D45A5A"/>
    </linearGradient>

    <!-- Cheek blush -->
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB5B5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFB5B5" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- === LAYER 1: BODY === -->
  <g id="body" filter="url(#shadow)" transform="translate(40, 60)">
    <polygon
      points="100,25 155,50 175,100 155,150 100,175 45,150 25,100 45,50"
      fill="url(#gemGradient)"
      stroke="#C44D4D"
      stroke-width="2"
    />
    <!-- Highlight facet -->
    <polygon
      points="100,25 155,50 140,75 100,45 60,75 45,50"
      fill="#F5A0A0"
      opacity="0.5"
    />
  </g>

  <!-- === LAYER 2: FACE === -->
  <g id="face" transform="translate(40, 60)">
    <!-- Left Eye -->
    <ellipse cx="75" cy="95" rx="12" ry="14" fill="#2D2D2D"/>
    <ellipse cx="78" cy="91" rx="4" ry="5" fill="#FFFFFF"/>

    <!-- Right Eye -->
    <ellipse cx="125" cy="95" rx="12" ry="14" fill="#2D2D2D"/>
    <ellipse cx="128" cy="91" rx="4" ry="5" fill="#FFFFFF"/>

    <!-- Smile -->
    <path
      d="M 85 115 Q 100 130 115 115"
      fill="none"
      stroke="#2D2D2D"
      stroke-width="3"
      stroke-linecap="round"
    />

    <!-- Cheeks -->
    <ellipse cx="55" cy="110" rx="12" ry="8" fill="url(#blush)"/>
    <ellipse cx="145" cy="110" rx="12" ry="8" fill="url(#blush)"/>
  </g>

  <!-- === LAYER 3: HAT (Fedora) === -->
  <g id="hat" transform="translate(40, 20)">
    <!-- Hat brim -->
    <ellipse cx="100" cy="65" rx="70" ry="12" fill="#3A3A3A"/>

    <!-- Hat crown -->
    <path
      d="M 40 65 Q 40 25 70 20 L 130 20 Q 160 25 160 65 Z"
      fill="url(#hatGradient)"
    />

    <!-- Hat band -->
    <rect x="45" y="50" width="110" height="8" fill="#2D2D2D" rx="2"/>

    <!-- Hat crease/indent -->
    <path
      d="M 70 20 Q 100 35 130 20"
      fill="none"
      stroke="#4A4A4A"
      stroke-width="3"
    />
  </g>

  <!-- === LAYER 4: HANDS === -->
  <g id="hands" transform="translate(40, 60)">
    <!-- Left Hand -->
    <ellipse cx="25" cy="140" rx="18" ry="16" fill="url(#handGradient)" stroke="#C44D4D" stroke-width="1.5"/>

    <!-- Right Hand -->
    <ellipse cx="175" cy="140" rx="18" ry="16" fill="url(#handGradient)" stroke="#C44D4D" stroke-width="1.5"/>
  </g>

  <!-- === LAYER 5: HELD ITEM (Terminal) === -->
  <g id="held-item" transform="translate(80, 175)">
    <!-- Terminal Window -->
    <rect x="0" y="0" width="120" height="80" rx="6" fill="#1E1E1E" stroke="#333" stroke-width="2"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="120" height="18" rx="6" fill="#333333"/>
    <rect x="0" y="12" width="120" height="6" fill="#333333"/>

    <!-- Traffic lights -->
    <circle cx="12" cy="9" r="4" fill="#FF5F56"/>
    <circle cx="26" cy="9" r="4" fill="#FFBD2E"/>
    <circle cx="40" cy="9" r="4" fill="#27CA3F"/>

    <!-- Terminal content -->
    <text x="8" y="35" font-family="monospace" font-size="9" fill="#00FF00">$ ls -la</text>
    <text x="8" y="47" font-family="monospace" font-size="8" fill="#CCCCCC">drwxr-xr-x  agents/</text>
    <text x="8" y="57" font-family="monospace" font-size="8" fill="#CCCCCC">-rw-r--r--  config.rb</text>
    <text x="8" y="67" font-family="monospace" font-size="9" fill="#00FF00">$ _</text>

    <!-- Cursor -->
    <rect x="18" y="60" width="6" height="10" fill="#00FF00" opacity="0.8"/>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 50" width="60" height="50">
  <!-- Bar Chart -->
  <g id="chart">
    <!-- Background -->
    <rect x="0" y="0" width="60" height="50" rx="4" fill="#FFF9E6" stroke="#E0D4B8" stroke-width="1"/>

    <!-- Bars -->
    <rect x="8" y="30" width="8" height="15" fill="#4A90D9"/>
    <rect x="20" y="20" width="8" height="25" fill="#5AB963"/>
    <rect x="32" y="12" width="8" height="33" fill="#E86B6B"/>
    <rect x="44" y="25" width="8" height="20" fill="#9B59B6"/>

    <!-- Trend line -->
    <path
      d="M 12 32 L 24 22 L 36 14 L 48 27"
      fill="none"
      stroke="#FF9500"
      stroke-width="2"
      stroke-linecap="round"
    />
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <!-- Globe -->
  <g id="globe">
    <!-- Earth circle -->
    <circle cx="25" cy="25" r="22" fill="#4A90D9" stroke="#3A7BC8" stroke-width="2"/>

    <!-- Latitude lines -->
    <ellipse cx="25" cy="25" rx="22" ry="8" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <ellipse cx="25" cy="25" rx="22" ry="16" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>

    <!-- Longitude lines -->
    <ellipse cx="25" cy="25" rx="8" ry="22" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <ellipse cx="25" cy="25" rx="16" ry="22" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>

    <!-- Simple continents -->
    <path
      d="M 15 12 Q 20 10 25 12 Q 28 15 26 20 Q 22 22 18 18 Q 14 15 15 12"
      fill="#5AB963"
      opacity="0.8"
    />
    <path
      d="M 30 20 Q 38 18 40 25 Q 42 32 35 35 Q 28 33 30 28 Q 32 24 30 20"
      fill="#5AB963"
      opacity="0.8"
    />
    <path
      d="M 12 28 Q 18 26 22 30 Q 20 38 14 36 Q 10 33 12 28"
      fill="#5AB963"
      opacity="0.8"
    />
  </g>
</svg>

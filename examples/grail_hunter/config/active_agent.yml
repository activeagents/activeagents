# Generation providers and telemetry, per environment.
#
# Providers. The framework's mock provider ships with the activeagent gem and
# needs no credentials: it runs the whole prompt -> provider -> response
# pipeline (usage accounting, telemetry, solid_agent persistence), so the app
# boots and hunts without any keys. It never calls tools, though, so a mock
# run falls back to heuristic ranking of the search backend's candidates.
# Set OPENAI_API_KEY or ANTHROPIC_API_KEY (and optionally AI_PROVIDER) for
# real agentic runs; app/agents/application_agent.rb picks the provider.
#
# Telemetry. Every generation is a trace. In development and test the traces
# are stored locally and browsable at /activeagents (admins only). In
# production they are posted to the ActiveAgents platform when
# ACTIVEAGENTS_API_KEY is set, and otherwise stored locally the same way.
shared:
  mock: &mock
    service: "Mock"
    model: "mock-model"

  openai: &openai
    service: "OpenAI"
    access_token: <%= ENV["OPENAI_API_KEY"] %>
    model: "<%= ENV.fetch("OPENAI_MODEL", "gpt-4o-mini") %>"

  anthropic: &anthropic
    service: "Anthropic"
    access_token: <%= ENV["ANTHROPIC_API_KEY"] %>
    model: "<%= ENV.fetch("ANTHROPIC_MODEL", "claude-haiku-4-5") %>"

  # One key, many models (https://openrouter.ai/models).
  openrouter: &openrouter
    service: "OpenRouter"
    access_token: <%= ENV["OPENROUTER_API_KEY"] %>
    model: "<%= ENV.fetch("OPENROUTER_MODEL", "openai/gpt-4o-mini") %>"

development:
  mock: *mock
  openai: *openai
  anthropic: *anthropic
  openrouter: *openrouter
  telemetry:
    enabled: true
    local_storage: true
    service_name: "grail_hunter"

test:
  mock: *mock
  telemetry:
    enabled: true
    local_storage: true
    service_name: "grail_hunter"

production:
  mock: *mock
  openai: *openai
  anthropic: *anthropic
  openrouter: *openrouter
  telemetry:
    enabled: true
    service_name: "grail_hunter"
    <% if ENV["ACTIVEAGENTS_API_KEY"].to_s.strip != "" %>
    endpoint: <%= ENV.fetch("ACTIVEAGENTS_TELEMETRY_ENDPOINT", "https://api.activeagents.ai/v1/traces") %>
    api_key: <%= ENV["ACTIVEAGENTS_API_KEY"] %>
    <% else %>
    local_storage: true
    <% end %>
